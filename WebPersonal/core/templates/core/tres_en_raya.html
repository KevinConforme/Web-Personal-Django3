<!DOCTYPE HTML> 
<html>
<HEAD>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<Title>Tres en Raya</Title>
<style>
body{
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
background-color: #f4f4f4;
padding: 15px;
box-sizing: border-box;
}
footer{
position: absolute; bottom: 15px; font-size: 0.85rem; color: #64748b; letter-spacing: 0.5px;
}
.titulo{
color: green;
user-select: none;
text-align: center;
margin-bottom: 10px;
font-size: 24px;
}
.selector-turno {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 20px;
user-select: none;
font-size: 14px;
font-weight: bold;
}
.selector-turno button {
padding: 6px 12px;
border: 2px solid #333;
background-color: #fff;
border-radius: 5px;
cursor: pointer;
font-weight: bold;
transition: all 0.2s ease;
}
.selector-turno button.seleccionado {
background-color: #007BFF;
color: white;
border-color: #0056b3;
}

.contenedor-juego {
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
width: 100%;
max-width: 350px;
}
.tablero{
display: grid;
grid-template-columns: repeat(3, 100px);
grid-template-rows: repeat(3, 100px);
gap: 1px;
width: max-content;
position: relative;
background-color: black;
border: 2px solid black;
}
.tablero-div{
background-color: gray;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 40px;
font-weight: bold;
user-select: none;
-webkit-user-select: none;
}
.tablero-div.X{
background-color: white;
color: green;
}
.tablero-div.O{
background-color: white;
color: red;
}
.jugador{
text-align: center;
background: #ffffff;
padding: 15px 5px;
border-radius: 8px;
border: 2px solid #333;
width: 100%;
max-width: 200px;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
transition: all 0.3s ease;
user-select: none;
box-sizing: border-box;
}
.jugador.activo{
border-color: #007BFF;
box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
transform: scale(1.03);
}
.jugador h3{
margin-top: 0;
margin-bottom: 8px;
font-size: 16px;
}
.jugador input{
width: 100%;
padding: 6px;
margin-bottom: 10px;
text-align: center;
font-weight: bold;
font-size: 12px;
border: 2px solid #ccc;
border-radius: 4px;
box-sizing: border-box;
}
.jugador p {
margin: 5px 0;
font-size: 14px;
}
.linea-ganadora {
position: absolute;
background-color: #ff9800;
height: 6px;
border-radius: 3px;
transform-origin: left center;
transition: width 0.4s ease-in-out;
width: 0;
z-index: 10;
pointer-events: none;
}

@media (min-width: 768px) {
.contenedor-juego {
    flex-direction: row;
    max-width: none;
    justify-content: center;
    gap: 30px;
}
.jugador {
    width: 140px;
}
select, button{
	padding: 8px 14px;
	font-size: 1rem;
	border: 2px solid #333;
	border-radius: 10px;
	cursor: pointer;
}
.controles{
	display: flex;
	gap: 10px;
	margin-bottom: 15px;
	flex-wrap: wrap;
	justify-content: center;
}
.titulo {
    font-size: 32px;
}
}
</style>
</HEAD>
<BODY>
<h1 class="titulo">JUEGO TRES EN RAYA</h1>

<div class="selector-turno">
    <span>Empieza jugando:</span>
    <button id="btnX" class="seleccionado" onclick="cambiarTurnoInicial(true)">EQUIS (X)</button>
    <button id="btnO" onclick="cambiarTurnoInicial(false)">CIRCULO (O)</button>
</div>
<div class="controles">
	<select id="modo">
		<option value="easy">COM vs Easy</option>
		<option value="medium">COM vs Medium</option>
		<option value="difficult">COM vs difficult</option>
		<option value="player">Player VS Player</option>
	</select>
	<p>&lt;-- Pronto estara activo</p> <!-- EL &lt; ACTIVA UN "<" EN MENSAJE-->
</div>

<div class="contenedor-juego">
    <div class="jugador" id="panelX">
        <h3>Jugador X</h3>
        <input type="text" id="nombreX" placeholder="ingresa tu nombre">
        <p>Ganadas: <span id="ganadasX">0</span></p>
        <p>Perdidas: <span id="perdidasX">0</span></p>
    </div>

    <div class="tablero">
        <div class="linea-ganadora" id="lineaGanadora"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
    </div>

    <div class="jugador" id="panelO">
        <h3>Jugador O</h3>
        <input type="text" id="nombreO" placeholder="ingresa tu nombre">
        <p>Ganadas: <span id="ganadasO">0</span></p>
        <p>Perdidas: <span id="perdidasO">0</span></p>
    </div>
</div>
<footer> Esto es una pequeña BROMITA Hecho por Kevin Conforme <p><a href="{% url 'juego' %}">Regresar</a></p></footer>
<script>
const celdas = document.querySelectorAll('.tablero-div');
let turnoX = true;
let estadoX = {ganadas: 0, perdidas: 0};
let estadoO = {ganadas: 0, perdidas: 0};

const inputX = document.getElementById('nombreX');
const inputO = document.getElementById('nombreO');
const ganaX = document.getElementById('ganadasX');
const pierdeX = document.getElementById('perdidasX');
const ganaO = document.getElementById('ganadasO');
const pierdeO = document.getElementById('perdidasO');
const panelX = document.getElementById('panelX');
const panelO = document.getElementById('panelO');
const lineaGanadora = document.getElementById('lineaGanadora');
const btnX = document.getElementById('btnX');
const btnO = document.getElementById('btnO');

const combinacionesGanadoras = [[0, 1, 2],[3, 4, 5],[6, 7, 8],[0, 3, 6],[1, 4, 7],[2, 5, 8],[0, 4, 8],[2, 4, 6]];

const estilosLinea = [
    { top: '48px', left: '0', width: '302px', transform: 'none' },
    { top: '150px', left: '0', width: '302px', transform: 'none' },
    { top: '252px', left: '0', width: '302px', transform: 'none' },
    { top: '0', left: '48px', width: '302px', transform: 'rotate(90deg)' },
    { top: '0', left: '150px', width: '302px', transform: 'rotate(90deg)' },
    { top: '0', left: '252px', width: '302px', transform: 'rotate(90deg)' },
    { top: '0', left: '0', width: '427px', transform: 'rotate(45deg)' },
    { top: '0', left: '302px', width: '427px', transform: 'rotate(135deg)' }
];

function actualizarTurno() {
    if (turnoX) {
        panelX.classList.add('activo');
        panelO.classList.remove('activo');
        btnX.classList.add('seleccionado');
        btnO.classList.remove('seleccionado');
    } else {
        panelO.classList.add('activo');
        panelX.classList.remove('activo');
        btnO.classList.add('seleccionado');
        btnX.classList.remove('seleccionado');
    }
}

function cambiarTurnoInicial(esX) {
    const tableroVacio = Array.from(celdas).every(celda => celda.textContent === '');
    if (!tableroVacio) {
        alert("No puedes cambiar quién empieza con una partida en curso. Termina o reinicia el juego.");
        return;
    }
    turnoX = esX;
    actualizarTurno();
}

actualizarTurno();

celdas.forEach(celda =>{
    celda.addEventListener('click',()=>{
        if (celda.textContent === ''){
            const jugador = turnoX ? 'X' : 'O';
            celda.textContent = jugador;
            celda.classList.add(jugador);

            const indiceGanador = obtenerIndiceGanador();
            if (indiceGanador !== -1){
                const nombreGanador = turnoX ? inputX.value : inputO.value;
                
                mostrarLinea(indiceGanador);

                if (turnoX){
                    estadoX.ganadas++;
                    estadoO.perdidas++;
                }else{
                    estadoX.perdidas++;
                    estadoO.ganadas++;
                }
                actualizarMarcador();

                setTimeout(() => {
                    alert(`¡El GANADOR es.. ${nombreGanador}!`);
                    reiniciarJuego();
                }, 350);
                return;
            }

            if (verificarEmpate()){
                setTimeout(() => {
                    alert('¡Empate!');
                    reiniciarJuego();
                }, 100);
                return;
            }

            turnoX = !turnoX;
            actualizarTurno();
        }
    });
});

function obtenerIndiceGanador(){
    for (let i = 0; i < combinacionesGanadoras.length; i++) {
        const [a, b, c] = combinacionesGanadoras[i];
        if (celdas[a].textContent && 
            celdas[a].textContent === celdas[b].textContent &&
            celdas[a].textContent === celdas[c].textContent) {
            return i;
        }
    }
    return -1;
}

function mostrarLinea(indice) {
    const estilo = estilosLinea[indice];
    lineaGanadora.style.top = estilo.top;
    lineaGanadora.style.left = estilo.left;
    lineaGanadora.style.transform = estilo.transform;
    lineaGanadora.style.width = estilo.width;
}

function verificarEmpate(){
    return Array.from(celdas).every(celda => celda.textContent !== '');
}

function actualizarMarcador(){
    ganaX.textContent = estadoX.ganadas;
    pierdeX.textContent = estadoX.perdidas;
    ganaO.textContent = estadoO.ganadas;
    pierdeO.textContent = estadoO.perdidas;
}

function reiniciarJuego(){
    celdas.forEach(celda => {
        celda.textContent = '';
        celda.classList.remove('X', 'O');
    });
    lineaGanadora.style.width = '0';
    actualizarTurno();
}
</script>
</BODY>
</HTML>
