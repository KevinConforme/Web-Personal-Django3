{% load static %}
<!DOCTYPE HTML> 
<html>
<HEAD>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<Title>Tres en Raya</Title>
<style>
body{
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
background-color: #aaa4a4;
padding: 15px;
box-sizing: border-box;
}
.titulo{
color: green;
user-select: none;
text-align: center;
margin-bottom: 10px;
font-size: 24px;
}
.selector-turno {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 20px;
user-select: none;
font-size: 14px;
font-weight: bold;
}
.selector-turno button {
padding: 6px 12px;
border: 2px solid #333;
background-color: #fff;
border-radius: 5px;
cursor: pointer;
font-weight: bold;
transition: all 0.2s ease;
}
.selector-turno button.seleccionado {
background-color: #007BFF;
color: white;
border-color: #0056b3;
}

.contenedor-juego {
display: flex;
flex-direction: column;
align-items: center;
gap: 20px;
width: 100%;
max-width: 350px;
}
.tablero{
display: grid;
grid-template-columns: repeat(3, 100px);
grid-template-rows: repeat(3, 100px);
gap: 1px;
width: max-content;
position: relative;
background-color: black;
border: 2px solid black;
}
.tablero-div{
background-color: gray;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 40px;
font-weight: bold;
user-select: none;
-webkit-user-select: none;
}
.tablero-div.X{
background-color: white;
color: green;
}
.tablero-div.O{
background-color: white;
color: red;
}
.jugador{
text-align: center;
background: #ffffff;
padding: 15px 5px;
border-radius: 8px;
border: 2px solid #333;
width: 100%;
max-width: 200px;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
transition: all 0.3s ease;
user-select: none;
box-sizing: border-box;
}
.jugador.activo{
border-color: #007BFF;
box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
transform: scale(1.03);
}
.jugador h3{
margin-top: 0;
margin-bottom: 8px;
font-size: 16px;
}
.jugador input{
width: 100%;
padding: 6px;
margin-bottom: 10px;
text-align: center;
font-weight: bold;
font-size: 12px;
border: 2px solid #ccc;
border-radius: 4px;
box-sizing: border-box;
}
.jugador p {
margin: 5px 0;
font-size: 14px;
}
.linea-ganadora {
position: absolute;
background-color: #ff9800;
height: 6px;
border-radius: 3px;
transform-origin: left center;
transition: width 0.4s ease-in-out;
width: 0;
z-index: 10;
pointer-events: none;
}

@media (min-width: 768px) {
.contenedor-juego {
    flex-direction: row;
    max-width: none;
    justify-content: center;
    gap: 30px;
}
.jugador {
    width: 140px;
}
select, button{
	padding: 8px 14px;
	font-size: 1rem;
	border: 2px solid #333;
	border-radius: 10px;
	cursor: pointer;
}
.controles{
	display: flex;
	gap: 10px;
	margin-bottom: 15px;
	flex-wrap: wrap;
	justify-content: center;
}
.titulo {
    font-size: 32px;
}
}
footer{
padding-top: 10px;
font-size: 0.85rem; 
color: white; 
letter-spacing: 0.5px;
text-align: center;
}
#regre{display: inline; margin: 0;}
#lin{
    color: black;
    text-decoration: none;
    margin-left: 4px;
}
.jugador.bloqueado-com {
    background-color: #d6d8db;
    border-color: #6c757d;
    opacity: 0.72;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

.jugador.bloqueado-com input {
    background-color: #727475;
    color: #f8f9fa;
    cursor: not-allowed;
}
</style>
</HEAD>
<BODY>
<h1 class="titulo">JUEGO TRES EN RAYA</h1>

<div class="selector-turno">
    <span>Empieza jugando:</span>
    <button type="button" id="btnX" class="seleccionado" >EQUIS (X)</button>
    <button type="button" id="btnO" >CIRCULO (O)</button>
</div>
<div class="controles">
	<select id="modo">
        <option value="player">Player VS Player</option>
		<option value="easy">COM vs Easy</option>
		<option value="medium">COM vs Medium</option>
		<option value="difficult">COM vs difficult</option>
	</select>
	<p>&lt;-- Pronto estara activo</p> <!-- EL &lt; ACTIVA UN "<" EN MENSAJE-->
</div>

<div class="contenedor-juego">
    <div class="jugador" id="panelX">
        <h3>Jugador X</h3>
        <input type="text" id="nombreX" placeholder="ingresa tu nombre">
        <p>Ganadas: <span id="ganadasX">0</span></p>
        <p>Perdidas: <span id="perdidasX">0</span></p>
    </div>

    <div class="tablero">
        <div class="linea-ganadora" id="lineaGanadora"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
        <div class="tablero-div"></div>
    </div>

    <div class="jugador" id="panelO">
        <h3>Jugador O</h3>
        <input type="text" id="nombreO" placeholder="ingresa tu nombre">
        <p>Ganadas: <span id="ganadasO">0</span></p>
        <p>Perdidas: <span id="perdidasO">0</span></p>
    </div>
</div>
<footer> Si quieres volver a escoger pulsa <span id="regre"><a id="lin" href="{% url 'juego' %}">Regresar</a></span></footer>
<script src="{% static 'js/tres_en_raya.js' %}"></script>
</BODY>
</HTML>
