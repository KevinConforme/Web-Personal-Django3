<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 44px;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 64px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f6f9f6;
      color: #222;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 32px;
      color: #1b5e20;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .contenedor {
      width: 100%;
      max-width: 95%;
      display: flex;
      justify-content: center;
    }

    .tabla {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 24px 28px;
      padding: 10px;
      text-align: center;
      width: 100%;
    }

    .tarjeta-juego {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 6px;
      border-radius: 14px;
    }

    .emoji-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 2.2rem;
      padding: 12px 18px;
      border: 2px solid #2e7d32;
      border-radius: 14px;
      background-color: #ffffff;
      box-shadow: 0 3px 8px rgba(27, 94, 32, 0.08);
      margin-bottom: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .emoji-link:hover {
      background-color: #e8f5e9;
      transform: translateY(-3px);
      box-shadow: 0 7px 16px rgba(27, 94, 32, 0.14);
    }

    .emoji-link:active {
      transform: translateY(0);
    }

    .emoji-link:focus-visible {
      outline: 3px solid #66bb6a;
      outline-offset: 3px;
    }

    p {
      margin: 0;
      font-size: 1rem;
      color: #2c352d;
      font-weight: 600;
      line-height: 1.3;
    }

    .btn-agregar .emoji-link {
      border-style: dashed;
      background-color: #fafdfb;
      color: #2e7d32;
      box-shadow: none;
    }

    .btn-agregar .emoji-link:hover {
      background-color: #edf7ed;
    }
  </style>
  <title>Juegos</title>
</head>
<body>
  <h1>Escoge qué quieres jugar</h1>

  <div class="contenedor">
    <div class="tabla" id="cuadricula-juegos">

      <!-- 1. Broma -->
      <div class="tarjeta-juego">
        <a href="broma.html" class="emoji-link">😂😁</a>
        <p>Broma</p>
      </div>

      <!-- 2. Tres en raya -->
      <div class="tarjeta-juego">
        <a href="tres_en_raya.html" class="emoji-link">❌⭕</a>
        <p>Tres en raya</p>
      </div>

      <!-- 3. Pregunta -->
      <div class="tarjeta-juego">
        <a href="pregunta.html" class="emoji-link">🤔❓</a>
        <p>Pregunta</p>
      </div>

      <!-- 4. Busca Minas -->
      <div class="tarjeta-juego">
        <a href="buscamina.html" class="emoji-link">🔎💣</a>
        <p>Busca Minas</p>
      </div>

      <!-- 5. Botón visual para agregar más juegos -->
      <div class="tarjeta-juego btn-agregar" id="btn-agregar">
        <span class="emoji-link">➕</span>
        <p>Agregar más juegos</p>
      </div>

    </div>
  </div>
</body>
</html>
