<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregunta muy Importante</title>
  <style>
    * { 
	   box-sizing: border-box; 
	   margin: 0; 
	   padding: 0; 
	   font-family: sans-serif; 
	}
    body { 
	    -webkit-user-select: none; 
	    user-select:none; 
		display: flex; 
		align-items: center; 
		justify-content: center; 
		min-height: 100vh; 
		background: #0f172a; 
		color: #fff; 
		text-align: center; 
		overflow: hidden; 
	}
    .card { 
	    background: #1e293b; 
	    padding: 40px 30px; 
	    border-radius: 16px; 
		box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
		width: 90%; 
		max-width: 400px; 
	}
    .emoji-pregunta { 
	   font-size: 5rem; 
	   margin-bottom: 15px; 
	   display: block; 
	}
    h1 { 
	   font-size: 1.8rem; 
	   margin-bottom: 30px; 
	}
	#pista { 
	    display : flex;
	    color: #facc15; 
	    font-size: 1rem; 
		margin-top: 10px;  
		min-height : 40px;
	}
    .btn-container { 
	    display: flex; 
	    justify-content: center; 
		gap: 20px; 
		min-height: 50px; 
	}
    button { 
	   padding: 12px 28px; 
	   font-size: 1.1rem; 
       font-weight: bold; 
	   border: none; 
	   border-radius: 8px; 
	   cursor: pointer; 
	}
    #btn-si { 
	   background: #22c55e; 
	   color: #fff; 
	}
    #btn-no { 
       background: #ef4444; 
	   color: #fff; 
	}
    .btn-reiniciar { 
	    background: #3b82f6; 
	    color: #fff; 
	    margin-top: 25px; 
	}
	button:focus{
	  box-shadow: 0 0 10px #facc15
	}
    .oculto { 
	   display : none;
	   visibility : hidden; 
	}
	footer{
	   position: absolute; 
	   bottom: 15px; 
	   font-size: 0.85rem; 
	   color: #64748b; 
	   letter-spacing: 0.5px;
	}
  </style>
</head>
<body>

  <div class="card">
    <div id="juego">
      <span class="emoji-pregunta">🤔</span>
      <h1>¿Quieres casarte conmigo?</h1>
      <div class="btn-container">
		<button id="btn-si" onmouseover="mover()">Sí</button>
        <button id="btn-no" onclick="ganar()">No</button>
      </div>
    </div>
	<div id="pista" class="oculto">
	</div>
    <div id="mensaje" class="oculto">
      <h1>¡Lo sabía 😭, tienes a alguien más 😢, espero sean felices 🥹!</h1>
      <button id="btn-rei" class="btn-reiniciar" onclick="reiniciar()" >Volver a intentar</button>
    </div>
  </div>
  <footer> Esto es una pequeña BROMITA Hecho por Kevin Conforme <p><a href="{% url 'juego' %}">Regresar</a></p></footer>

  <script>
    const btnNo = document.getElementById('btn-no');
	const btnSi = document.getElementById('btn-si');
	let intentos = 0;
	const msj = document.getElementById('pista');
	//version ordenador por teclado
	btnSi.addEventListener('keydown' , function(e){
		if(e.key === 'Enter'){
			mover();
		}		
	});
	//version movil
    btnSi.addEventListener('touchstart', function(e){
	   e.preventDefault();
	   mover();
	});
	function mover(){
		const rect1 = btnSi.getBoundingClientRect();
		const rect2 = btnNo.getBoundingClientRect();
		btnSi.style.position = 'fixed';
		btnNo.style.position = 'fixed';
		btnSi.style.left = rect2.left + 'px';
		btnSi.style.top = rect2.top + 'px';
		btnNo.style.left = rect1.left + 'px';
		btnNo.style.top = rect1.top + 'px';
		intentos++;
	    if (intentos === 10){
		    msj.innerText = "Si se mueve es porque no lo deseas en verdad";
		    msj.classList.remove('oculto');
			setTimeout(() => {
				btnNo.focus();
			}, 20);
	    }
	}

    function ganar() {
	  document.getElementById('juego').classList.add('oculto');
      document.getElementById('mensaje').classList.remove('oculto');
      document.getElementById('btn-rei').focus();
	  msj.classList.add('oculto');
    }
	 function restaurarBoton(boton){
	  boton.style.position = 'static';
	  boton.style.left ='';
	  boton.style.top = '';
	  boton.style.display = 'inline-block';
	  
	} 
    function reiniciar() {
      // Restablecer visibilidad
      document.getElementById('mensaje').classList.add('oculto');
      document.getElementById('juego').classList.remove('oculto');
	  msj.classList.add('oculto');
      intentos = 0;
	  
      // Regresar el botón "No" a su posición y estilo original dentro de la tarjeta
	  restaurarBoton(btnSi);
	  restaurarBoton(btnNo);
    }
	/*
	==============================
	Proyecto: Juego de Pregunta 
	Version: 1.1.0
	Autor: Kevin Conforme
	==============================
	Version para movil
	Mejora para funcionar con el tocuch de la pantalla 
	==============================
	Mejoras
	Al presionar ENTER se siguen cambiando de posición
	Accion de focus al mensaje de volver a intentar
	Al contar mas de 10 intentos el focus cambia automaticamente al boton no
	*/
	
  </script>

</body>
</html>
